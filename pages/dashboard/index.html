<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>对话管理</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="side-head">
          <span class="side-title">对话列表</span>
          <button id="btn-refresh" class="icon-btn" title="刷新列表">⟳</button>
        </div>
        <div id="conv-list" class="conv-list"></div>
        <div class="side-foot">
          <button id="btn-settings" class="btn ghost full">⚙ 设置</button>
        </div>
      </aside>
      <main id="main">
        <div id="placeholder" class="placeholder">← 从左侧选择一个对话开始管理</div>
        <div id="editor" class="editor hidden">
          <header id="ed-head">
            <div class="ed-title">
              <h2 id="ed-user">—</h2>
              <span id="ed-meta" class="muted small"></span>
            </div>
            <div class="ed-actions">
              <span id="guard-card" class="guard" title="上下文压力估算"></span>
              <button id="btn-snapshots" class="btn">快照</button>
              <button id="btn-export" class="btn">导出</button>
              <button id="btn-import" class="btn">导入</button>
              <button id="btn-compress" class="btn primary">压缩</button>
            </div>
          </header>
          <div id="save-bar" class="save-bar hidden">
            <span id="save-msg">有未保存的修改</span>
            <button id="btn-save" class="btn primary">保存更改</button>
            <button id="btn-discard" class="btn">放弃</button>
          </div>
          <div id="banner" class="banner hidden"></div>
          <div id="timeline"></div>
          <div class="timeline-more">
            <button id="btn-more" class="btn ghost hidden">加载更早消息</button>
          </div>
          <div id="insert-bar" class="insert-bar">
            <button id="btn-insert" class="btn ghost">＋ 在末尾插入消息</button>
          </div>
        </div>
      </main>
    </div>
    <div id="modal-root"></div>
    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <script src="app.js"></script>
  </body>
</html>
